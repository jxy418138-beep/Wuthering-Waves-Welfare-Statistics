<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鸣潮福利统计</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#2f6df6">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#6b7385;--ac:#2f6df6;--bd:#e3e6ee;--hd:#eef2ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1f2a;--tx:#e8ebf3;--mut:#8f97ab;--ac:#6b9bff;--bd:#2a3040;--hd:#232a3d}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1f2a;--tx:#e8ebf3;--mut:#8f97ab;--ac:#6b9bff;--bd:#2a3040;--hd:#232a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px;max-width:820px;margin-inline:auto}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.pad{padding:10px 12px}
button,input[type=search],textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}
textarea{width:100%;height:60px;box-sizing:border-box;margin-top:6px}
input[type=search]{width:100%;box-sizing:border-box;margin-bottom:10px}
.mut{color:var(--mut);font-size:12px}
.vh{display:flex;align-items:baseline;gap:10px;background:var(--hd);padding:8px 12px;border-bottom:1px solid var(--bd)}
.vn{font-size:26px;font-weight:700;color:var(--ac);line-height:1}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;background:var(--card)}
td.n{white-space:normal;min-width:130px}
td.r{white-space:normal;min-width:120px}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;background:var(--hd);color:var(--ac);border-radius:6px;padding:0 6px;margin:1px 3px 1px 0;font-size:12px}
.code{display:inline-block;font-family:ui-monospace,monospace;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 8px;margin:3px 4px 3px 0;cursor:pointer;font-size:13px}
details{margin-top:6px}summary{cursor:pointer;color:var(--mut);font-size:12px}
ul{padding-left:18px;margin:4px 0}
</style>
</head>
<body>
<h1>鸣潮福利统计</h1>
<details class="card pad" id="imp"><summary>手动导入 data.json</summary>
  <input type="file" id="f" accept=".json">
  <textarea id="t" placeholder="或粘贴 data.json 内容"></textarea>
  <button id="go" style="margin-top:6px">载入</button>
</details>
<div class="mut" id="upd" style="margin-bottom:8px"></div>
<div id="app"><div class="mut">加载中…</div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA=null;
function load(txt){
  let d;try{d=JSON.parse(txt)}catch(e){alert("JSON 格式不正确");return}
  try{localStorage.setItem("wuwa",txt)}catch(e){}
  render(d);
}
const md=s=>s?s.slice(5):"—";            // 2026-10-08 04:00 -> 10-08 04:00
const dur=a=>a.days==null||a.days===""?"—":(typeof a.days==="number"?a.days+" 天":a.days);
function render(d){
  DATA=d;$("upd").textContent=d.updated?"数据更新于 "+d.updated:"";
  const vs=Object.keys(d.versions||{});
  $("app").innerHTML=`<input type="search" id="q" placeholder="搜索版本 / 活动 / 兑换码">`+`<div id="list"></div>`;
  $("q").oninput=draw;draw();
}
function draw(){
  const q=($("q")?.value||"").trim().toLowerCase();
  const html=Object.entries(DATA.versions).reverse().map(([ver,v])=>{
    const acts=(v.activities||[]).filter(a=>!q||(ver+a.name+a.type+(a.reward||[]).join("")).toLowerCase().includes(q));
    const codes=(v.codes||[]).filter(c=>!q||(ver+c.code).toLowerCase().includes(q));
    const sums=(v.welfare||[]).filter(w=>w.kind==="汇总");
    if(!acts.length&&!codes.length&&q)return"";
    const rows=acts.map(a=>`<tr><td class="n"><b>${esc(a.name)}</b><div class="mut">${esc(a.type)}</div></td><td>${md(a.start)}</td><td>${a.end==="永久"||a.end==="下版本前"?esc(a.end):md(a.end)}</td><td>${dur(a)}</td><td class="r">${(a.reward||[]).map(r=>`<span class="tag">${esc(r)}</span>`).join("")||'<span class="mut">—</span>'}</td></tr>`).join("");
    return `<div class="card"><div class="vh"><span class="vn">${esc(ver)}</span><span class="mut">${v.start?esc(v.start)+" 开服":""} · 活动 ${(v.activities||[]).length} · 兑换码 ${(v.codes||[]).length}</span></div>
    ${rows?`<div class="scroll"><table><thead><tr><th>活动</th><th>开始</th><th>结束</th><th>持续</th><th>福利</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="pad mut">暂无活动时间表（需要该版本的官方公告链接）</div>`}
    ${codes.length||sums.length?`<div class="pad">${codes.map(c=>`<span class="code" data-c="${esc(c.code)}" title="${esc(c.source)}，点击复制">${esc(c.code)}</span>`).join("")}${sums.length?`<details><summary>星声/抽数汇总 ${sums.length} 条</summary><ul>${sums.map(w=>`<li>${esc(w.text)} <a class="mut" href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.source)}</a></li>`).join("")}</ul></details>`:""}</div>`:""}</div>`}).join("");
  $("list").innerHTML=html||'<div class="mut">没有匹配的结果</div>';
  document.querySelectorAll(".code").forEach(e=>e.onclick=()=>{navigator.clipboard?.writeText(e.dataset.c);e.style.borderColor="var(--ac)"});
}
$("f").onchange=e=>e.target.files[0]?.text().then(load);
$("go").onclick=()=>$("t").value.trim()&&load($("t").value);
fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>{
  try{const s=localStorage.getItem("wuwa");if(s)return render(JSON.parse(s))}catch(e){}
  $("app").innerHTML='<div class="mut">还没有数据。运行爬虫生成 data.json，或在上方手动导入。</div>';
  $("imp").open=true;
});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
